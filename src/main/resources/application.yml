server:
  port: 8085

spring:
  application:
    name: springboot-rag
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: rag
    password: rag
  sql:
    init:
      mode: always   # run schema.sql on startup
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mvc:
    async:
      # LLM streaming (/chat/stream) can run far longer than the ~30s container default.
      # Without this, a long generation is cut mid-stream with an InterruptedException.
      request-timeout: 600000   # 10 minutes; -1 would disable the timeout entirely

app:
  # Two fake users in different groups - the smallest setup that can prove permission-aware
  # retrieval works (docs/RAG-MASTERY.md section 1). Plain-text passwords and an in-memory
  # directory are SANDBOX ONLY; a real system swaps this whole block for an identity provider.
  security:
    default-group: public          # stamped on ingest when no groups are named
    backfill-qdrant-groups: true   # label pre-ACL Qdrant points at startup, like schema.sql does for Postgres
    users:
      - username: alice
        password: alice
        groups: [public, hr]
      - username: haiks
        password: 123123
        groups: [public, eng]
  embedding:
    provider: ollama
    model: nomic-embed-text
    dimension: 768
  chat:
    model: qwen3:4b
    context-chunks: 5
    condense-followups: true   # rewrite chat follow-ups into a standalone search query before retrieving
  understand:
    enabled: true
    model: ""              # empty = app.chat.model
    max-conditions: 4
    facet-samples: 5
    facet-ttl-seconds: 300
    max-value-length: 200
  route:
    enabled: true
    model: ""              # empty = app.chat.model. Point at a small model to tier (RAG-MASTERY 8)
    num-predict: 32        # the reply is one word; anything longer is leaked reasoning
  ollama:
    base-url: http://localhost:11434
  qdrant:
    host: localhost
    port: 6334
    collection: chunks
  rerank:
    provider: ""          # set to "djl" to enable the real cross-encoder
    # Must exist in DJL's own zoo (https://mlrepo.djl.ai), not just on HuggingFace - djl:// needs
    # a pre-traced TorchScript build. Heavier alternative: BAAI/bge-reranker-v2-m3.
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    candidates: 50        # hybrid candidates fed to the reranker before trimming to topK
    maxLength: 512
  graph:
    enabled: true
    # structural | semantic | both.
    # structural (default): link/hierarchy edges only - fast, no LLM.
    # semantic | both: entity extraction runs ONE LLM (app.chat.model) call PER CHUNK at
    #   ingest AND one extraction call per graph query. Opt in when you want orphan
    #   reconnection via shared entities; expect much slower ingest on large corpora.
    edges: structural
    neighbor-hops: 1
    candidates: 50
    extract-model: ""      # RESERVED - not yet wired; extraction currently uses app.chat.model
    min-mentions: 1

management:
  endpoints:
    web:
      exposure:
        include: health
